services:
  # Backend FastAPI service
  - type: web
    name: kicad-ai-backend
    runtime: python
    buildCommand: "cd kicad-ai-backend && pip install poetry && poetry config virtualenvs.create false && poetry install"
    startCommand: "cd kicad-ai-backend && poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /healthz

  # Frontend static site
  - type: web
    name: kicad-ai-frontend
    runtime: static
    buildCommand: "cd kicad-ai-frontend && npm install && npm run build"
    staticPublishPath: kicad-ai-frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kicad-ai-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
